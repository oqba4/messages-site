<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إرسال رسالة</title>

<style>
body{
margin:0;
font-family:Arial;
direction:rtl;
background:#f7c8d8;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:auto;
}

.box{
background:white;
padding:30px;
border-radius:20px;
width:90%;
max-width:420px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

textarea{
width:90%;
height:160px;
padding:10px;
border-radius:12px;
font-size:16px;
}

button{
margin-top:12px;
padding:12px 18px;
border:none;
border-radius:12px;
background:#ff5e78;
color:white;
cursor:pointer;
font-size:15px;
}
</style>
</head>
<body>

<div class="box">

<h2>إرسال رسالة ✨</h2>

<textarea id="msg"></textarea><br>

<button onclick="saveMessage()">إرسال</button><br>

<button onclick="window.location.href='library.html'">مكتبة الرسائل 📚</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getMessaging,
getToken,
onMessage
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const firebaseConfig = {
apiKey: "AIzaSyBHIZp9BwmQ8s4O1s7x1Iuesz4zpEyRJ2U",
authDomain: "my-profacto-messages-library.firebaseapp.com",
projectId: "my-profacto-messages-library",
storageBucket: "my-profacto-messages-library.firebasestorage.app",
messagingSenderId: "520812951520",
appId: "1:520812951520:web:4f3edc0996d32c3cda9d85"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const messaging=getMessaging(app);

navigator.serviceWorker.register("firebase-messaging-sw.js").then(async registration=>{
await getToken(messaging,{
vapidKey:"BB0TNE0Z_NeVXIRJvfKTimKmInfEvUlNdMt4u2aAjPLez20oDgSWpJ5K9qE6YdGKi2mxVLwkY82ylsv_dNq2568",
serviceWorkerRegistration: registration
});
});

onMessage(messaging,(payload)=>{
new Notification(payload.notification.title,{
body: payload.notification.body
});
});

window.saveMessage=async function(){

let text=document.getElementById('msg').value.trim();

if(text===""){
alert("اكتب رسالة");
return;
}

await addDoc(collection(db,"messages"),{
text:text,
time:serverTimestamp()
});

document.getElementById('msg').value="";

alert("تم الإرسال ✨");

location.reload();

};

</script>

</body>
</html>
