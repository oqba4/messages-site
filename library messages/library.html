<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الرسائل</title>

<style>
body{
margin:0;
font-family:Arial;
direction:rtl;
background:#d9c2ff;
padding:20px;
padding-bottom:140px;
}

.box{
background:white;
padding:20px;
border-radius:20px;
max-width:700px;
margin:auto;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.message{
padding:12px;
margin:10px 0;
border-radius:14px;
background:#f3f3f3;
}

button{
padding:10px 15px;
border:none;
background:#ff5e78;
color:white;
border-radius:10px;
cursor:pointer;
}

.inputBar{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
background:white;
padding:10px;
border-radius:18px;
width:90%;
max-width:700px;
display:flex;
gap:8px;
}

textarea{
flex:1;
height:45px;
border-radius:12px;
padding:10px;
}
</style>
</head>

<body>

<audio id="notifySound" preload="auto">
<source src="https://www.soundjay.com/buttons/sounds/button-3.mp3" type="audio/mpeg">
</audio>

<div class="box" id="login">
<input id="pin">
<button onclick="checkPin()">دخول</button>
</div>

<div class="box" id="library" style="display:none;">
<div id="messages"></div>
</div>

<div class="inputBar" id="inputBar" style="display:none;">
<select id="sender">
<option value="⭐">⭐</option>
<option value="🌙">🌙</option>
<option value="🌕">🌕</option>
<option value="🌓">🌓</option>
<option value="☀️">☀️</option>
</select>

<textarea id="newMsg"></textarea>
<button onclick="sendDirect()">إرسال</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
query,
orderBy,
doc,
getDoc,
addDoc,
serverTimestamp,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getMessaging,
getToken
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const firebaseConfig = {
apiKey: "AIzaSyBHIZp9BwmQ8s4O1s7x1Iuesz4zpEyRJ2U",
authDomain: "my-profacto-messages-library.firebaseapp.com",
projectId: "my-profacto-messages-library",
storageBucket: "my-profacto-messages-library.firebasestorage.app",
messagingSenderId: "520812951520",
appId: "1:520812951520:web:4f3edc0996d32c3cda9d85"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const messaging = getMessaging(app);

navigator.serviceWorker.register("firebase-messaging-sw.js");

getToken(messaging,{
vapidKey:"BB0TNE0Z_NeVXIRJvfKTimKmInfEvUlNdMt4u2aAjPLez20oDgSWpJ5K9qE6YdGKi2mxVLwkY82ylsv_dNq2568"
}).then((token)=>{
console.log(token);
});

let allMessages=[];
let firstLoad=true;

window.checkPin = async function(){

const docRef = doc(db,"settings","main");
const docSnap = await getDoc(docRef);

if(docSnap.exists()){

if(document.getElementById('pin').value===docSnap.data().pass){

document.getElementById('login').style.display='none';
document.getElementById('library').style.display='block';
document.getElementById('inputBar').style.display='flex';

if(Notification.permission!=="granted"){
await Notification.requestPermission();
}

startRealtime();

}

}

};

function startRealtime(){

const q = query(collection(db,"messages"),orderBy("time","desc"));

onSnapshot(q,(snapshot)=>{

let newMessages=[];

snapshot.forEach(doc=>{
newMessages.push(doc.data());
});

if(!firstLoad && newMessages.length>allMessages.length){

let latest=newMessages[0];

new Notification("رسالة جديدة 💌",{
body: latest.sender+" "+latest.text
});

document.getElementById('notifySound').play();

}

firstLoad=false;
allMessages=newMessages;

showMessages();

});

}

function showMessages(){

let html='';

allMessages.forEach(d=>{

html+=`
<div class="message">
${d.sender} ${d.text}
</div>
`;

});

document.getElementById('messages').innerHTML=html;

}

window.sendDirect=async function(){

let text=document.getElementById('newMsg').value.trim();
if(text==="") return;

let sender=document.getElementById('sender').value;

await addDoc(collection(db,"messages"),{
text:text,
sender:sender,
time:serverTimestamp()
});

document.getElementById('newMsg').value='';

};

</script>

</body>
</html>
